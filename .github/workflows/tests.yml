name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: >-
          python -m py_compile
          tweaks/shared/codex/hold-to-dictate/dictation_core.py
          tweaks/linux/codex/hold-to-dictate/codex_hold_to_dictate.py
      - name: Test
        run: python -m unittest discover -s tweaks/linux/codex/hold-to-dictate/tests -v
      - name: Check shell entry points
        run: bash -n install.sh uninstall.sh tweaks/linux/codex/hold-to-dictate/*.sh

  windows-entry-points:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell entry points
        shell: pwsh
        run: |
          .\install.ps1 -List
          .\uninstall.ps1 -List
