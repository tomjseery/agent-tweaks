name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: >-
          python -m py_compile
          tweaks/codex-hold-to-dictate/dictation_core.py
          tweaks/codex-hold-to-dictate/linux/codex_hold_to_dictate.py
      - name: Test
        run: python -m unittest discover -s tweaks/codex-hold-to-dictate/tests -v
